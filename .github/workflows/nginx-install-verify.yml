name: Ubuntu Nginx Installer Verify

on:
  workflow_dispatch:
  watch:
    types: [started]

jobs:
  install-and-verify:
    name: Install and verify on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Ubuntu base tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git

      - name: Run nginx installer (with logs)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/nginx-ci-logs
          sudo bash nginx/install_nginx.sh \
            -y \
            --auto-latest 0 \
            --brand Fungit \
            --no-rewrite-unit \
            --waf-policy optional \
            --sync-waf \
            2>&1 | tee /tmp/nginx-ci-logs/install.log

      - name: Verify nginx binary and runtime config
        shell: bash
        run: |
          set -euxo pipefail
          sudo /usr/local/nginx/current/sbin/nginx -V 2>&1 | tee /tmp/nginx-ci-logs/nginx-v.log
          sudo /usr/local/nginx/current/sbin/nginx -t -p /usr/local/nginx-data/ -c conf/nginx.conf \
            2>&1 | tee /tmp/nginx-ci-logs/nginx-t.log
          sudo test -f /usr/local/nginx-data/conf/nginx.conf
          sudo test -f /usr/local/nginx-data/conf/lua/resty/http.lua
          sudo test -f /usr/local/nginx-data/conf/waf/waf.conf

      - name: Upload install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nginx-install-logs-ubuntu
          path: /tmp/nginx-ci-logs/
          if-no-files-found: warn
